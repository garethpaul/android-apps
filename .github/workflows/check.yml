name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Authenticate Gradle wrapper
        shell: bash
        run: |
          test -x /usr/bin/sha256sum
          cd "$GITHUB_WORKSPACE"
          /usr/bin/sha256sum --strict --check <<'GRADLE_WRAPPER_SHA256'
          874d75d37bf38c810a8314e0b2f78a3c77fce9437963ae33cec8543d92662b61  traveller-android-app/gradlew
          e2b82129ab64751fd40437007bd2f7f2afb3c6e41a9198e628650b22d5824a14  traveller-android-app/gradle/wrapper/gradle-wrapper.jar
          3938dfe4bc3a01a40bd2da0c099bbc863381ec24e5cf5e3f4adb556fe2bf4621  traveller-android-app/gradle/wrapper/gradle-wrapper.properties
          GRADLE_WRAPPER_SHA256

      - name: Provision legacy Android SDK
        shell: bash
        run: |
          : "${ANDROID_HOME:?GitHub runner must provide ANDROID_HOME}"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          set +o pipefail
          yes | "$sdkmanager" --licenses >/dev/null
          set -o pipefail
          "$sdkmanager" 'platforms;android-19' 'build-tools;24.0.3'
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: zulu
          java-version: '7'

      - name: Run Traveller baseline
        run: make check
