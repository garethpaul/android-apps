name: Check

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Authenticate Gradle wrapper
        shell: bash
        run: |
          test -x /usr/bin/sha256sum
          cd "$GITHUB_WORKSPACE"
          /usr/bin/sha256sum --strict --check <<'GRADLE_WRAPPER_SHA256'
          cf139290d3b7334cc99b58ecb6adc549c59ecb8f1f4162b122ad4590ead7585e  traveller-android-app/gradlew
          f4d953f31fbf6c38a8c330d19171c8ba6e0d1ff59d4d5c5c2d3ed821c9f3d5a3  traveller-android-app/gradle/wrapper/gradle-wrapper.jar
          45971c7481b5fb9a3bc7345986390cf518d1d47803af4a0007e9201e4167c38c  traveller-android-app/gradle/wrapper/gradle-wrapper.properties
          GRADLE_WRAPPER_SHA256

      - name: Provision legacy Android SDK
        shell: bash
        run: |
          : "${ANDROID_HOME:?GitHub runner must provide ANDROID_HOME}"
          sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          test -x "$sdkmanager"
          set +o pipefail
          yes | "$sdkmanager" --licenses >/dev/null
          set -o pipefail
          "$sdkmanager" 'platforms;android-19' 'build-tools;26.0.2'
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: zulu
          java-version: '8'

      - name: Run Traveller baseline
        run: make check
