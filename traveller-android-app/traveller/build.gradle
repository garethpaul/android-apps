apply plugin: 'com.android.application'

android {
    compileSdkVersion 19
    buildToolsVersion "26.0.2"

    defaultConfig {
        minSdkVersion 13
        targetSdkVersion 19
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.txt'
        }
    }
}

dependencies {
    implementation 'com.android.support:appcompat-v7:19.1.0'
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation files('libs/Parse-1.5.0.jar')
}

task generateConstants(type: Exec) {
    commandLine 'sh', new File(rootDir, '../scripts/prepare-traveller-constants.sh').canonicalPath
}

preBuild.dependsOn generateConstants
